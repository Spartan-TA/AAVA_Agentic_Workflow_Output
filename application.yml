spring:
  application:
    name: warehouse-employee-management
  datasource:
    url: jdbc:postgresql://localhost:5432/wem
    username: wem_user
    password: secret
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080
security:
  mode: oauth2
