server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems
    username: wms_user
    password: wms_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG

security:
  jwt:
    secret: "SuperSecretJWTKeyForWarehouseEMS"
    expiration: 3600000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

