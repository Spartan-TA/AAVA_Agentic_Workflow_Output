# Test Configuration for SpringBoot Test Suite
# This configuration is used when running tests with @ActiveProfiles("test")

server:
  port: 0  # Random port for testing

spring:
  application:
    name: warehouse-ems-test
  
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  flyway:
    enabled: false  # Disable Flyway for tests, use JPA auto-create
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/auth/realms/test

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    com.warehouseems: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

warehouseems:
  notifications:
    email:
      enabled: false
    sms:
      enabled: false
  locale:
    default: en_US
  security:
    jwt:
      secret: test-secret-key-for-testing-only
      expiration: 86400000