spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: i18n/messages
  profiles:
    active: default

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,beans
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: "supersecretkey"
    expiration: 3600000

warehouse:
  notifications:
    email:
      from: "noreply@warehouse.com"
      enabled: true
    sms:
      enabled: true
  multi-tenant:
    enabled: true

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
