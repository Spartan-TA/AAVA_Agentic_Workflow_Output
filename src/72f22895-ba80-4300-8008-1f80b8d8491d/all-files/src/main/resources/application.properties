# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/wems
spring.datasource.username=wems_user
spring.datasource.password=wems_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.open-in-view=false

# Security
wems.security.jwt.secret=ReplaceWithAStrongSecretKey
wems.security.api-key=ReplaceWithStrongApiKey
spring.security.user.name=admin
spring.security.user.password=admin

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework=INFO
logging.level.com.wems=DEBUG

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
