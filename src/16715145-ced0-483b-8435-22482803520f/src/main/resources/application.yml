server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wem_db
    username: wem_user
    password: wem_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.example.com
    port: 587
    username: mailuser
    password: mailpassword
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
security:
  rbac:
    enabled: true
    roles:
      - ADMIN
      - HR
      - SUPERVISOR
      - WORKER
notifications:
  email:
    enabled: true
  sms:
    enabled: false
logging:
  level:
    root: INFO
    com.company.wem: DEBUG
