version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: dogrc
      POSTGRES_PASSWORD: supersecurepassword
      POSTGRES_DB: dogrcdb
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgres://dogrc:supersecurepassword@db:5432/dogrcdb
      JWT_SECRET: change_this_secret
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - db
    ports:
      - '4000:4000'
  frontend:
    build: ./frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:4000/api
    depends_on:
      - backend
volumes:
  dbdata: