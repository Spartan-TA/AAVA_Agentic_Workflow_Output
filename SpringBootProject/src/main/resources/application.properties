# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse
spring.datasource.username=warehouse_user
spring.datasource.password=warehouse_pass
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://your-idp/.well-known/jwks.json
jwt.secret=your-very-secure-secret
jwt.expiration=3600000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Mail
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=your-email@example.com
spring.mail.password=your-email-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Logging
logging.level.org.springframework=INFO
logging.level.com.warehouse=DEBUG

# Notification
notification.sms.provider=twilio
notification.sms.api-key=your-twilio-api-key

# PWA
pwa.manifest.path=/manifest.json

# Multi-tenancy
multitenancy.enabled=true

# OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# SFTP
sftp.host=payroll-sftp.example.com
sftp.port=22
sftp.user=payroll_user
sftp.password=payroll_pass

# Observability
management.metrics.export.prometheus.enabled=true
management.tracing.enabled=true