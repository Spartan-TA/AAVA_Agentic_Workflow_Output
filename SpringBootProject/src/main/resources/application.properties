# Spring Boot Application Properties

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_ems
spring.datasource.username=warehouse_user
spring.datasource.password=warehouse_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security
spring.security.jwt.secret=SuperSecretJwtKeyForWarehouseEMS
spring.security.jwt.expiration=3600000

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework=INFO
logging.level.com.warehouse.ems=DEBUG

# Profiles
spring.profiles.active=dev
