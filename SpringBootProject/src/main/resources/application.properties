spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_ems
spring.datasource.username=ems_user
spring.datasource.password=ems_password
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://your-idp/.well-known/jwks.json
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
jwt.secret=your_jwt_secret
jwt.expiration=3600000