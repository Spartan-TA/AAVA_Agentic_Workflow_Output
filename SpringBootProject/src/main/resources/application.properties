# Spring Boot Application Properties

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_db
spring.datasource.username=warehouse_user
spring.datasource.password=warehouse_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Security
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# JWT/OAuth2 (example placeholder)
security.jwt.secret=ChangeThisSecretKey
security.jwt.expiration=3600000

# Mail (for notifications)
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=notification@example.com
spring.mail.password=changeme
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Localization
spring.messages.basename=messages

# Multi-Tenancy
warehouse.tenant.default=default

# Logging
logging.level.org.springframework=INFO
logging.level.com.warehouse=DEBUG

# Swagger/OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Prometheus
management.metrics.export.prometheus.enabled=true

# Zipkin
spring.zipkin.base-url=http://localhost:9411/
spring.sleuth.sampler.probability=1.0
