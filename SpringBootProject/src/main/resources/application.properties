# Spring Boot Application Properties

# Server
server.port=8080

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_ems
dspring.datasource.username=warehouse_user
spring.datasource.password=warehouse_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Logging
logging.level.org.springframework=INFO
logging.level.com.warehouse=DEBUG

# Application
app.name=Warehouse Employee Management System
