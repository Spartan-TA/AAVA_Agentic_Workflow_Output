# =============================
# Database Configuration
# =============================
spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_ems
database.driverClassName=org.postgresql.Driver
spring.datasource.username=ems_user
spring.datasource.password=securePassword123
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================
# Flyway Migration
# =============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================
# Spring Security
# =============================
# Toggle between OAuth2 and API Key authentication
security.auth.type=oauth2 # options: oauth2, apikey

# OAuth2 Settings
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.example.com/realms/warehouse
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://auth.example.com/realms/warehouse/protocol/openid-connect/certs

# API Key Settings
security.api-key.header=X-API-KEY
security.api-key.value=ReplaceWithSecureApiKey

# =============================
# Actuator Endpoints
# =============================
spring.boot.admin.client.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,loggers,env,beans,threaddump,heapdump
management.endpoint.health.show-details=always
management.server.port=8081

# =============================
# Server Settings
# =============================
spring.application.name=warehouse-ems
server.port=8080
server.servlet.context-path=/api/v1

# =============================
# Logging Configuration
# =============================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.file.name=logs/warehouse-ems.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# =============================
# SFTP Configuration (Payroll Export)
# =============================
sftp.host=sftp.payroll.example.com
sftp.port=22
sftp.user=payroll_exporter
sftp.password=ReplaceWithStrongPassword
sftp.remote.directory=/exports/payroll
sftp.private-key-path=

# =============================
# Notification Settings
# =============================
# Email
notification.email.enabled=true
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=ReplaceWithUsername
spring.mail.password=ReplaceWithPassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
notification.email.from=ems@warehouse.com

# SMS (using Twilio as example)
notification.sms.enabled=true
twilio.account.sid=ReplaceWithTwilioSID
twilio.auth.token=ReplaceWithTwilioAuthToken
twilio.phone.number=+1234567890

# =============================
# Miscellaneous
# =============================
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
