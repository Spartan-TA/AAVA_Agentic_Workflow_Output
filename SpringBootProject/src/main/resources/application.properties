# Spring Boot Application Properties
spring.application.name=warehouse-ems
server.port=8080

# Database Configuration (H2 for dev, PostgreSQL for prod)
spring.datasource.url=jdbc:h2:mem:emsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator Endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=
#spring.security.oauth2.client.registration.

# Logging
logging.level.org.springframework=INFO
logging.level.com.warehouse.ems=DEBUG

# Other configs as needed
