spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_ems
spring.datasource.username=warehouse_user
spring.datasource.password=warehouse_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
server.port=8080
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.security.enabled=false
warehouse.security.oauth2.enabled=true
warehouse.security.api-key.enabled=false
warehouse.notifications.email.enabled=true
warehouse.notifications.sms.enabled=true
warehouse.notifications.quiet-hours=22:00-06:00
warehouse.integration.hris.enabled=true
warehouse.integration.wms.enabled=true
warehouse.integration.sftp.enabled=true
warehouse.audit.enabled=true
