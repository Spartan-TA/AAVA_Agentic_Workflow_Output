# Spring Boot Application Properties

spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_employee_db
spring.datasource.username=warehouse_user
spring.datasource.password=warehouse_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security
jwt.secret=SuperSecretJWTKeyForWarehouseEmployeeSystem
jwt.expiration=3600000

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Internationalization
i18n.enabled=true

# Multi-tenancy (if needed)
multitenancy.enabled=false

# Logging
logging.level.org.springframework=INFO
logging.level.com.warehouse.employee=DEBUG
