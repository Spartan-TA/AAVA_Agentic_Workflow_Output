spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_ems
spring.datasource.username=warehouse
spring.datasource.password=warehouse
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.security.jwt.secret=SuperSecretJwtKeyForWarehouseEMS
spring.security.jwt.expiration=3600000
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
warehouse.geofence.radius=100
warehouse.default-locale=en