# Spring Boot Application Properties
server.port=8080
spring.application.name=WarehouseEmployeeManagement

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_db
spring.datasource.username=warehouse_user
spring.datasource.password=warehouse_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator Endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

# Security
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# JWT Secret
jwt.secret=SuperSecretJWTKeyForWarehouseApp
jwt.expiration=3600000

# OpenAPI/Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Email (for notifications)
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=notification@example.com
spring.mail.password=changeme
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Multi-Tenant
warehouse.tenant.isolation=true

# Logging
logging.level.root=INFO
logging.level.com.warehouse.management=DEBUG
logging.pattern.console={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","thread":"%t","logger":"%c","message":"%m"}%n

# OpenTelemetry
otel.exporter.otlp.endpoint=http://localhost:4317
otel.resource.attributes=service.name=WarehouseEmployeeManagement

# Prometheus
management.metrics.export.prometheus.enabled=true
