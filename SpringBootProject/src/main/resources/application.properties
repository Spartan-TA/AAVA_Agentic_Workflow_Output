server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_employee
spring.datasource.username=warehouse_user
spring.datasource.password=warehouse_pass
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.liquibase.enabled=false
springdoc.api-docs.path=/api-docs
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://idp.example.com/.well-known/jwks.json
management.endpoints.web.exposure.include=health,info,prometheus
warehouse.notifications.email.enabled=true
warehouse.notifications.sms.enabled=true
warehouse.notifications.quiet-hours=22:00-06:00
warehouse.localization.default-locale=en_US
warehouse.multi-tenant.enabled=true