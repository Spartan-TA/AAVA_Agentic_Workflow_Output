# Server configuration
server.port=8080

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_ems
spring.datasource.username=ems_user
spring.datasource.password=ems_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Management endpoints
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

# Caching
spring.cache.type=simple
spring.cache.cache-names=employees,attendance,shifts,leave,certifications,safety,assets,performance,notifications,audit,tenants

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.warehouse.ems=DEBUG
logging.file.name=logs/ems.log

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Security (example OAuth2 config)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.example.com/

# Multi-tenancy
ems.multi-tenancy.enabled=true

# Other custom properties
ems.notifications.enabled=true
ems.audit.enabled=true
