# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_ems
spring.datasource.username=warehouse_user
spring.datasource.password=warehouse_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.org.springframework=INFO
logging.level.com.warehouse.ems=DEBUG

# Security
jwt.secret=SuperSecretJwtKeyForWarehouseEMS
jwt.expiration=3600000

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Internationalization
spring.messages.basename=messages

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html