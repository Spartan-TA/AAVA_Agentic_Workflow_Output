# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/wms_ems
spring.datasource.username=wms_user
spring.datasource.password=wms_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security
spring.security.oauth2.enabled=true
security.api-key-header=X-API-KEY
security.api-key-value=your-api-key-here

# JPA Auditing
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Cache
spring.cache.type=simple

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html