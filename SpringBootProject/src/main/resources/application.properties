spring.application.name=WarehouseEmployeeManagementSystem
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_mgmt
spring.datasource.username=warehouse_user
spring.datasource.password=warehouse_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security
spring.security.jwt.secret=SuperSecretJWTKey
spring.security.jwt.expiration=3600000
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080
spring.security.api-key-header=X-API-KEY

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.warehouse.management=DEBUG

# Multi-Tenant
warehouse.tenant.default=main
warehouse.tenant.isolation=true

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
