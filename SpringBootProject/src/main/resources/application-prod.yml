spring:
  datasource:
    url: jdbc:postgresql://prod-db-server:5432/warehouse_ems_prod
    username: prod_user
    password: prod_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
server:
  port: 80
logging:
  level:
    root: WARN
    org.springframework.web: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
