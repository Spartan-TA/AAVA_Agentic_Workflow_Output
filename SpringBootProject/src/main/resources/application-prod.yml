# Production profile configuration

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    clean-disabled: true

logging:
  level:
    root: WARN
    com.company.wms: INFO

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics