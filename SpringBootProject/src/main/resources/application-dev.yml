spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems_dev
    username: dev_user
    password: dev_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8081
logging:
  level:
    root: DEBUG
    org.springframework.web: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: '*'
