# Development profile configuration

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wms_dev
    username: dev_user
    password: dev_password
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: false

logging:
  level:
    root: DEBUG
    org.springframework.web: DEBUG
    com.company.wms: DEBUG

server:
  port: 8080