server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems
    username: ems_user
    password: ems_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.example.com
    port: 587
    username: noreply@warehouse.com
    password: mail_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: "supersecretkeyforjwt"
  expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

localization:
  supported-languages: en,es

notification:
  quiet-hours:
    start: 22:00
    end: 06:00

pwa:
  enabled: true