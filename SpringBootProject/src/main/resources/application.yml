# Default profile (dev)
spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems
    username: ems_user
    password: ems_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: https://auth.warehouse.com/
        jwk-set-uri: https://auth.warehouse.com/.well-known/jwks.json
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.warehouse.ems: DEBUG
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
server:
  port: 8081
logging:
  level:
    root: WARN
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://prod-db:5432/warehouse_ems
    username: prod_user
    password: prod_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
server:
  port: 8080
logging:
  level:
    root: INFO
    org.springframework.web: WARN
    com.warehouse.ems: INFO
