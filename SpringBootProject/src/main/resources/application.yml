server:
  port: 8080
  servlet:
    context-path: /
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_db
    username: warehouse_user
    password: strongpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,logfile
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
security:
  oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: http://localhost:8080/.well-known/jwks.json
warehouse:
  notifications:
    email:
      from: noreply@warehouse.com
      enabled: true
    sms:
      enabled: true
      provider: twilio
      api-key: your-twilio-api-key
  payroll:
    export:
      sftp:
        host: sftp.payrollprovider.com
        port: 22
        username: payroll_export
        password: sftp_password
        remote-dir: /exports
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.warehouse: DEBUG
