# Base application.yml for Warehouse Employee Management System
spring:
  application:
    name: warehouse-employee-mgmt
  datasource:
    url: jdbc:h2:mem:wmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active: dev

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG

jwt:
  secret: "supersecretkeyforjwt"
  expiration: 3600000

openapi:
  title: Warehouse Employee Management System API
  version: 1.0.0
  description: OpenAPI documentation for WMS Employee Management
