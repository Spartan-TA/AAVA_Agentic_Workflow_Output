server:
  port: 8080
  servlet:
    context-path: /
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.company.warehouse: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n'
  file:
    name: logs/warehouse-employee-mgmt.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
security:
  jwt:
    secret: "change_this_secret_for_prod"
    expiration: 3600000 # 1 hour
  oauth2:
    enabled: false
    client-id: "warehouse-client"
    client-secret: "warehouse-secret"
    issuer-uri: "https://auth.example.com/realms/warehouse"
notifications:
  email:
    from: "noreply@warehouse.com"
    enabled: true
  sms:
    enabled: false
