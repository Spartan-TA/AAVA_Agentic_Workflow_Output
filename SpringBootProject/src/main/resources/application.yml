server:
  port: 8080

spring:
  application:
    name: warehouse-ems
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems
    username: ${DB_USERNAME:warehouse}
    password: ${DB_PASSWORD:ems123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: smtp.example.com
    port: 587
    username: noreply@warehouse.com
    password: ${MAIL_PASSWORD:mailpassword}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://auth.example.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

warehouse:
  notifications:
    sms-provider: twilio
    email-provider: smtp
  security:
    api-key-enabled: true
    oauth2-enabled: false
  tenant:
    default-locale: en_US
    default-timezone: America/New_York
  pwa:
    enabled: true
  payroll:
    export-path: /var/exports/payroll
    sftp-enabled: false