server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehousemgmt
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: default
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.warehousemgmt: DEBUG
security:
  oauth2:
    enabled: false
  api-key:
    enabled: true
    header: X-API-KEY
    keys:
      - "sample-api-key-123"
warehousemgmt:
  quiet-hours:
    start: "22:00"
    end: "06:00"
  locale: en_US
  multiTenant: true
  jwt:
    secret: "supersecretjwtkey"
    expiration: 3600000
