server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wmsdb
    username: wmsuser
    password: wmspassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: "supersecretkey"
  expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

mail:
  host: smtp.example.com
  port: 587
  username: noreply@example.com
  password: mailpassword
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true