spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wems
    username: wems_user
    password: wems_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  messages:
    basename: i18n/messages

server:
  port: 8080

jwt:
  secret: "ChangeThisSecretKeyForProduction"
  expiration: 3600000 # 1 hour in ms

logging:
  level:
    root: INFO
    com.company.wems: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

multi-tenant:
  enabled: true
  default-tenant: "default"
