server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehousemgmt
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  main:
    allow-bean-definition-overriding: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: https://auth.warehousemgmt.com/
        jwk-set-uri: https://auth.warehousemgmt.com/.well-known/jwks.json

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.warehousemgmt: DEBUG

warehousemgmt:
  notifications:
    email:
      enabled: true
      from: "noreply@warehousemgmt.com"
    sms:
      enabled: true
      provider: "twilio"
  multi-tenant:
    enabled: true
    default-tenant: "main"
