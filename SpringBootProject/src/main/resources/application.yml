server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wms
    username: wms_user
    password: wms_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.example.com
    port: 587
    username: user@example.com
    password: secret
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: "supersecretjwtkey"
  expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: "*"

wms:
  notifications:
    sms-provider: "twilio"
    email-enabled: true
  i18n:
    default-locale: en
    supported-locales: en,es,fr,de
  security:
    oauth2-enabled: false