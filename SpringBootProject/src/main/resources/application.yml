server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: warehouse-management-system
  
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

jwt:
  secret: "SuperSecretJWTKeyForWarehouseEmployeeMgmtSystemChangeInProduction"
  expiration: 86400000 # 1 day in milliseconds

security:
  rbac:
    enabled: true
  oauth2:
    enabled: false

localization:
  default-locale: en
  supported-locales: en,es,fr,de

geofence:
  enabled: true
  warehouse-latitude: 37.7749
  warehouse-longitude: -122.4194
  radius-meters: 100

sftp:
  host: sftp.payroll.example.com
  port: 22
  username: warehouse_sftp
  password: changeme
  remote-directory: /payroll/uploads

scheduling:
  optimization:
    enabled: true
    solver-timeout-seconds: 300

logging:
  level:
    root: INFO
    com.warehouse.management: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:warehouse
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
  
logging:
  level:
    root: WARN
    com.warehouse.management: INFO