server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wems
    username: wems_user
    password: wems_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://idp.company.com/oauth2/default
    api-key:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
wems:
  notification:
    channels: ["email", "sms", "in-app"]
  locale: en_US
  warehouses:
    default: "Main Warehouse"
