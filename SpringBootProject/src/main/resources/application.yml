# Spring Boot Application Configuration for Warehouse Employee Management System
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wems_db
    username: wems_user
    password: wems_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  messages:
    basename: i18n/messages
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.companyname.wems: DEBUG
  file:
    name: logs/wems.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

security:
  jwt:
    secret: "supersecretkeyforjwtgeneration"
    expiration: 3600000 # 1 hour
  oauth2:
    client:
      registration:
        google:
          client-id: your-google-client-id
          client-secret: your-google-client-secret
          scope:
            - openid
            - profile
            - email

wems:
  multi-tenant:
    enabled: true
  notification:
    email:
      from: noreply@companyname.com
    sms:
      provider: twilio
      account-sid: your-twilio-sid
      auth-token: your-twilio-token
      from-number: +1234567890
