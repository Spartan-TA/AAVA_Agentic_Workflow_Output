server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wms_employee
    username: wms_user
    password: wms_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: "ChangeThisSecretKeyForProduction"
  expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.wms.employee: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html