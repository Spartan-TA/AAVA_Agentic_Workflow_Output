server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wms
    username: wms_user
    password: wms_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  liquibase:
    enabled: false

logging:
  level:
    root: INFO
    com.wms: DEBUG
  logstash:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: https://auth.example.com/
        jwk-set-uri: https://auth.example.com/.well-known/jwks.json

multi-tenancy:
  enabled: true
  strategy: SCHEMA

tenant:
  default: public

audit:
  enabled: true

notifications:
  email:
    enabled: true
    from: noreply@warehouse.com
  sms:
    enabled: true
    provider: twilio

localization:
  default-locale: en_US
  supported-locales: en_US,es_ES,fr_FR

pwa:
  enabled: true