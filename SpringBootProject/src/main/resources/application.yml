server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouseems
    username: warehouseems
    password: warehouseems123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/auth/realms/warehouseems
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    com.warehouseems: DEBUG
warehouseems:
  notifications:
    email:
      enabled: true
    sms:
      enabled: true
  locale:
    default: en_US
