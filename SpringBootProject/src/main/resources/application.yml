spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems
    username: ems_user
    password: ems_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: '*'

security:
  jwt:
    secret: "change_this_secret_in_prod"
    expiration: 3600000

warehouse:
  integration:
    hris:
      url: "https://hris.example.com/api/employees"
    wms:
      url: "https://wms.example.com/api/locations"
    payroll:
      sftp:
        host: "sftp.example.com"
        port: 22
        user: "payroll"
        password: "payroll_password"
    notification:
      email:
        from: "noreply@warehouse.com"
      sms:
        provider: "twilio"
