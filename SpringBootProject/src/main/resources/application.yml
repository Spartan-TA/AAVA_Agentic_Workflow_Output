server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ems
    username: ems_user
    password: ems_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: "SuperSecretJWTKeyForEMS"
  expiration: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.warehouse.ems: DEBUG