server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/emsdb
    username: ems_user
    password: ems_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: "ReplaceWithAStrongSecretKeyForJWTs"
  expiration: 3600000 # 1 hour in ms
  issuer: "wms-ems"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# OAuth2 toggle
security:
  oauth2:
    enabled: false

logging:
  level:
    org.springframework: INFO
    com.wms.ems: DEBUG
