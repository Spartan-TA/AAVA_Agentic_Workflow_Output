spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehousemgmt
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  profiles:
    active: dev

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: "supersecretjwtkey"
    expiration: 86400
  oauth2:
    enabled: false

warehousemgmt:
  notifications:
    email:
      enabled: true
    sms:
      enabled: true
  localization:
    default-locale: en
    supported-locales: en,es,fr,de
  multi-tenant:
    enabled: true
