server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehousemgmt
    username: warehouse
    password: warehouse
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.example.com
    port: 587
    username: user
    password: pass
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

jwt:
  secret: "supersecretjwtkey"
  expiration: 3600000

security:
  oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: https://idp.example.com/.well-known/jwks.json

notifications:
  email:
    enabled: true
  sms:
    enabled: false
  inapp:
    enabled: true

localization:
  default-locale: en
  supported-locales: en,es,fr,de