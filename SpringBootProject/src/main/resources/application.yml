spring:
  application:
    name: wems
  datasource:
    url: jdbc:postgresql://localhost:5432/wems
    username: wems_user
    password: wems_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: i18n/messages
  profiles:
    active: dev

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

jwt:
  secret: "supersecretjwtkey"
  expiration: 3600000

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/wems_dev
    username: wems_dev
    password: dev_pass

---
spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: jdbc:postgresql://staging-db:5432/wems_staging
    username: wems_staging
    password: staging_pass

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://prod-db:5432/wems_prod
    username: wems_prod
    password: prod_pass