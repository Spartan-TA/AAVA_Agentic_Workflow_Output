server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:emsdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

security:
  jwt:
    secret: "supersecretkey"
    expiration: 3600000

cors:
  allowed-origins: "*"
  allowed-methods: "*"