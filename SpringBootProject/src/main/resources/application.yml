spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wems_db
    username: wems_user
    password: wems_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  main:
    allow-bean-definition-overriding: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: "supersecretkeyforjwtgeneration"
    expiration: 3600000 # 1 hour
    issuer: "wems-app"

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.companyname.wems: DEBUG
