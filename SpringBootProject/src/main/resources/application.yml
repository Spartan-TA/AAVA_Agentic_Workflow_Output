server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://db:5432/warehouse_ems
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: "SuperSecretJWTKeyForWarehouseEMS"
  expiration: 86400000 # 1 day

security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: https://auth.warehouse.com/
        jwk-set-uri: https://auth.warehouse.com/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health,info

warehouse:
  notification:
    email:
      from: "noreply@warehouse.com"
      smtp:
        host: "smtp.warehouse.com"
        port: 587
        username: "smtp_user"
        password: "smtp_pass"
    sms:
      provider: "twilio"
      accountSid: "ACXXXXXXXXXXXXXXXXXXXXXXXX"
      authToken: "your_auth_token"
      from: "+1234567890"
  geofence:
    enabled: true
    radius: 100 # meters