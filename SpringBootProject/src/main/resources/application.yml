server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: warehouse-employee-management
  
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_db
    username: ${DB_USERNAME:warehouse_user}
    password: ${DB_PASSWORD:warehouse_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    open-in-view: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  
  security:
    jwt:
      secret: ${JWT_SECRET:supersecretkeythatshouldbereplacedwithastrongsecret}
      expiration: 3600000 # 1 hour in milliseconds
    oauth2:
      enabled: false
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}
  
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.warehouse.employee: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/warehouse-employee-management.log
    max-size: 10MB
    max-history: 30

warehouse:
  security:
    jwt:
      secret: ${JWT_SECRET:supersecretkeythatshouldbereplacedwithastrongsecret}
      expiration: 3600000
    api-key:
      enabled: true
      header-name: X-API-Key
  multi-tenant:
    enabled: false
    default-tenant: default
  geofence:
    enabled: true
    radius-meters: 100
  notifications:
    email:
      enabled: true
      from: noreply@warehouse-employee-mgmt.com
    sms:
      enabled: true
    quiet-hours:
      start: "22:00"
      end: "06:00"
  payroll:
    export:
      enabled: true
      schedule: "0 0 1 * * ?" # Daily at 1 AM
      retry:
        max-attempts: 3
        backoff-delay: 60000 # 1 minute
  integration:
    hris:
      enabled: false
      base-url: ${HRIS_BASE_URL:}
      api-key: ${HRIS_API_KEY:}
    wms:
      enabled: false
      base-url: ${WMS_BASE_URL:}
      api-key: ${WMS_API_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true