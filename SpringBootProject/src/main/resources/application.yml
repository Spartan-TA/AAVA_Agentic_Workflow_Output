spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_employee_management
    username: warehouse_admin
    password: warehouse_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
spring:
  profiles: staging
  datasource:
    url: jdbc:postgresql://staging-db:5432/warehouse_employee_management
    username: warehouse_admin
    password: warehouse_password
---
spring:
  profiles: prod
  datasource:
    url: jdbc:postgresql://prod-db:5432/warehouse_employee_management
    username: warehouse_admin
    password: warehouse_password