server:
  port: 8080
  servlet:
    context-path: /
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: i18n/messages
    encoding: UTF-8
  profiles:
    active: default
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
security:
  oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: http://localhost:9000/.well-known/jwks.json
  api-key:
    enabled: false
    header: X-API-KEY
    value: changeme
notifications:
  email:
    enabled: true
    from: noreply@warehouse.com
    host: smtp.mailtrap.io
    port: 2525
    username: mailuser
    password: mailpass
  sms:
    enabled: false
    provider: twilio
    account-sid: your_sid
    auth-token: your_token
    from: '+1234567890'
  push:
    enabled: false
    fcm-key: your_fcm_key
localization:
  supported-locales: en,es
tenancy:
  enabled: true
  default-tenant: main
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    com.warehouse: DEBUG
