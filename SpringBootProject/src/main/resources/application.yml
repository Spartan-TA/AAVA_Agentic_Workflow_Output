spring:
  application:
    name: warehouse-employee-mgmt
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse
    username: warehouse
    password: warehouse
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cache:
    type: caffeine
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080
server:
  port: 8080
  servlet:
    context-path: /api
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
logging:
  level:
    root: INFO
    com.companyname.warehouse: DEBUG
app:
  security:
    jwt:
      secret: your-256-bit-secret
      expiration: 86400000
  geofence:
    enabled: false
  notifications:
    email:
      enabled: false
    sms:
      enabled: false