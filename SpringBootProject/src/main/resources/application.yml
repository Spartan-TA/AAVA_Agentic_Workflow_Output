# Spring Boot Application Configuration for WEMS
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wems
    username: wems_user
    password: wems_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  liquibase:
    enabled: false
  profiles:
    active: dev

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG

security:
  oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: http://localhost:8080/.well-known/jwks.json

wems:
  notifications:
    email:
      from: noreply@company.com
    sms:
      provider: dummy
  pwa:
    enabled: true
