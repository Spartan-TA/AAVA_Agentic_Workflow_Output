spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_employee_mgmt
    username: warehouse_admin
    password: warehouse_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: public
  security:
    jwt:
      secret: "supersecretjwtkey"
      expiration: 3600000
    api-key:
      enabled: true
      keys:
        - "sample-api-key-1"
        - "sample-api-key-2"
    oauth2:
      resource-server:
        jwt:
          jwk-set-uri: "https://auth.example.com/.well-known/jwks.json"
  actuator:
    endpoints:
      web:
        exposure:
          include: health, info, metrics, prometheus
    security:
      roles:
        - ROLE_ADMIN
        - ROLE_HR
        - ROLE_SUPERVISOR
        - ROLE_SAFETY_OFFICER
        - ROLE_PAYROLL_ADMIN
  tenant:
    enabled: true
    header: X-Tenant-Id
    default: "default-tenant"
features:
  attendance:
    geofence-enabled: true
    correction-approval-required: true
  scheduling:
    blackout-dates-enabled: true
logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
server:
  port: 8080
  servlet:
    context-path: /api
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
  security:
    enabled: true
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
