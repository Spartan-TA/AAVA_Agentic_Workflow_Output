server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems
    username: ems_user
    password: ems_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: http://localhost:8080/.well-known/jwks.json
  api-key:
    enabled: false # Set true to enable API key auth

warehouse:
  rbac:
    enabled: true
  localization:
    default-locale: en
    supported-locales: en,es
