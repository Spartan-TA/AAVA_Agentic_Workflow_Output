server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wmsdb
    username: wmsuser
    password: wmspassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.example.com
    port: 587
    username: noreply@example.com
    password: mailpassword
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: https://idp.example.com
        jwk-set-uri: https://idp.example.com/.well-known/jwks.json

notifications:
  quiet-hours:
    start: "22:00"
    end: "06:00"

localization:
  default-locale: en_US
  supported-locales:
    - en_US
    - es_ES
    - fr_FR