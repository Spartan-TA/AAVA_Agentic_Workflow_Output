spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

security:
  oauth2:
    enabled: false
  api-key:
    enabled: true

logging:
  level:
    root: INFO
    com.warehouse.ems: DEBUG

locale:
  default: en_US

warehouse:
  multi-warehouse-enabled: true
