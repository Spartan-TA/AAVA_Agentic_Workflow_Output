# Main Spring Boot configuration for Warehouse Employee Management System

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wms_db
    username: wms_user
    password: wms_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      pool-name: HikariCP
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,loggers
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.company.wms: DEBUG

security:
  jwt:
    secret: "ReplaceWithAStrongSecretKeyForJWT"
    expiration: 86400000 # 1 day in ms
  api-key:
    header: "X-API-KEY"
    value: "ReplaceWithSecureApiKey"