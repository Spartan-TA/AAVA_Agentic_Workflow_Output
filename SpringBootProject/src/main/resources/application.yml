server:
  port: 8080

spring:
  application:
    name: warehouse-employee-management
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_db
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

security:
  oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: https://your-idp/.well-known/jwks.json

notifications:
  email:
    enabled: true
    from: no-reply@warehouse.com
    smtp:
      host: smtp.warehouse.com
      port: 587
      username: smtp_user
      password: smtp_pass

localization:
  default-locale: en_US
  supported-locales: en_US,es_ES,fr_FR

logging:
  level:
    root: INFO
    com.warehouse.management: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"