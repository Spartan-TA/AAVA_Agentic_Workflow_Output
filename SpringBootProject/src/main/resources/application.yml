spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems
    username: wems_user
    password: wems_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.wems: DEBUG

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

security:
  jwt:
    secret: myjwtsecretkey
    expiration: 3600

locale:
  default: en_US

warehouse:
  default: main
