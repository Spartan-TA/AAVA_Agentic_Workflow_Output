spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wms_db
    username: wms_user
    password: wms_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active: default

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: "SuperSecretJwtKeyForWMS"
    expiration: 3600000

multi-tenancy:
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

locale:
  default: en_US

company:
  wms:
    notifications:
      enabled: true
    audit:
      enabled: true
