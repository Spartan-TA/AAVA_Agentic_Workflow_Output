spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
  servlet:
    context-path: /api
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
---
spring:
  profiles: prod
  datasource:
    url: jdbc:postgresql://prod-db-server:5432/warehouse_ems
    username: prod_user
    password: prod_pass
  jpa:
    show-sql: false
logging:
  level:
    root: INFO