spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wms
    username: wms_user
    password: wms_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  profiles:
    active: dev

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

jwt:
  secret: "supersecretkeyforjwt"
  expiration: 3600000

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
