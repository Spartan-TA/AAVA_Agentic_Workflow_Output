spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems
    username: ems_user
    password: ems_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.warehouse.com/
          jwk-set-uri: https://auth.warehouse.com/.well-known/jwks.json
    api-key:
      enabled: false
      header-name: X-API-KEY
      keys:
        - "sample-api-key"
  mail:
    host: smtp.mailtrap.io
    port: 2525
    username: mail_user
    password: mail_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
logging:
  level:
    root: INFO
    org.springframework: INFO
    com.warehouse.ems: DEBUG
