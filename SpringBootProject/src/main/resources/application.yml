server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:warehouse;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

security:
  jwt:
    secret: "SuperSecretJwtKeyForWarehouseEmployeeMgmt"
    expiration: 86400 # seconds

app:
  notifications:
    email:
      enabled: true
    sms:
      enabled: false
  rbac:
    api-key-enabled: false
    oauth2-enabled: true