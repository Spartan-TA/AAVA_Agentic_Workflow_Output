server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:warehouse;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
security:
  jwt:
    secret: "SuperSecretJWTKeyForWarehouseEmployeeMgmtSystem"
    expiration: 3600000
  oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: "https://idp.example.com/.well-known/jwks.json"
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.company.warehouse: DEBUG
warehouse:
  notifications:
    email:
      enabled: true
      from: "no-reply@warehouse.com"
    sms:
      enabled: true
      provider: "twilio"
  localization:
    default-locale: "en_US"
    supported-locales:
      - "en_US"
      - "es_ES"
      - "fr_FR"
