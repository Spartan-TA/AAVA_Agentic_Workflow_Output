server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_db
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.warehouse.com/
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.warehouse: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
jwt:
  secret: "SuperSecretJWTKeyForWarehouseEmployeeMgmt"
  expiration: 86400
