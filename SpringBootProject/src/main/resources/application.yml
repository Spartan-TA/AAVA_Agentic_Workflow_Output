# Default application configuration
spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems
    username: wms_user
    password: wms_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems_dev
    username: wms_dev
    password: wms_dev_password

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://prod-db:5432/warehouse_ems
    username: wms_prod
    password: wms_prod_password
  jpa:
    show-sql: false
logging:
  level:
    root: WARN
