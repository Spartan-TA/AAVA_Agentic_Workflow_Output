server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_employee_db
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  liquibase:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: https://idp.example.com/oauth2/default
        jwk-set-uri: https://idp.example.com/oauth2/default/v1/keys
  api-key:
    enabled: false
integration:
  hris:
    api-url: https://hris.example.com/api/employees
    api-key: ""
  wms:
    api-url: https://wms.example.com/api/locations
    api-key: ""
notifications:
  email:
    enabled: true
    from: noreply@warehouse.com
    smtp:
      host: smtp.warehouse.com
      port: 587
      username: smtp_user
      password: smtp_pass
  sms:
    enabled: true
    provider: twilio
    account-sid: ""
    auth-token: ""
