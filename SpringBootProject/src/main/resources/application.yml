server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_ems
    username: ems_user
    password: ems_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  oauth2:
    resource-server:
      jwt:
        issuer-uri: https://auth.warehouse.com/
  api-key:
    enabled: true
    header: X-API-KEY
    keys:
      - "supersecretapikey1"
      - "supersecretapikey2"

integration:
  hris:
    url: https://hris.warehouse.com/api
    token: hris_token
  wms:
    url: https://wms.warehouse.com/api
    token: wms_token

logging:
  level:
    root: INFO
    com.warehouse.ems: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus