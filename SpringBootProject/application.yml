server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_db
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  liquibase:
    enabled: false
  mail:
    host: smtp.mailtrap.io
    port: 2525
    username: mail_user
    password: mail_pass
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    jwt:
      secret: "SuperSecretJWTKeyForWarehouseEmployeeMgmtSystem"
      expiration: 3600000
    oauth2:
      enabled: false
      client-id: "warehouse-client"
      client-secret: "warehouse-secret"
      provider-uri: "https://auth.example.com"
  messages:
    basename: messages
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
warehouse:
  integrations:
    hris:
      api-url: "https://hris.example.com/api"
      api-key: "hris-api-key"
    payroll:
      sftp-host: "sftp.payroll.example.com"
      sftp-user: "payroll_user"
      sftp-pass: "payroll_pass"
    optimization:
      api-url: "https://optimize.example.com/api"
    geofencing:
      api-url: "https://geo.example.com/api"
    document-storage:
      provider: "aws"
      s3-bucket: "warehouse-docs"
      access-key: "aws-access-key"
      secret-key: "aws-secret-key"
    notification:
      email-enabled: true
      sms-enabled: true
      websocket-enabled: true
    bi:
      tableau-url: "https://tableau.example.com"
      powerbi-url: "https://powerbi.example.com"
logging:
  level:
    root: INFO
    org.springframework: INFO
    com.warehouse: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
