server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse
    username: warehouse_user
    password: warehouse_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: "supersecretkeyforjwtgeneration"
  expiration: 86400000 # 1 day in ms

logging:
  level:
    root: INFO
    com.warehouse.employeemgmt: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Email/SMS notification config (example)
notification:
  email:
    from: "noreply@warehouse.com"
    smtp:
      host: smtp.mailtrap.io
      port: 2525
      username: user
      password: pass
  sms:
    provider: "twilio"
    account-sid: "ACXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
    auth-token: "your_auth_token"
    from: "+1234567890"

# OAuth2 config (example)
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://your-idp/.well-known/jwks.json