spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wms_employee
    username: wms_user
    password: wms_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: public
  main:
    allow-bean-definition-overriding: true

server:
  port: 8081

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    com.company.wms: DEBUG
