name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn -B clean package --file pom.xml
      - name: Run Tests
        run: mvn test
      - name: Build Docker image
        run: docker build -t warehouse-ems:ci .
      - name: Archive JAR
        uses: actions/upload-artifact@v4
        with:
          name: ems-jar
          path: target/ems-1.0.0.jar
