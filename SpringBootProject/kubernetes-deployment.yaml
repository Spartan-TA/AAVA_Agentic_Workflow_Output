apiVersion: v1
kind: ConfigMap
metadata:
  name: ems-config
  labels:
    app: warehouse-ems
  namespace: default
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/warehouse_ems
  SPRING_DATASOURCE_USERNAME: ems_user
  SPRING_DATASOURCE_PASSWORD: ems_password
  SERVER_PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-ems-deployment
  labels:
    app: warehouse-ems
spec:
  replicas: 3
  selector:
    matchLabels:
      app: warehouse-ems
  template:
    metadata:
      labels:
        app: warehouse-ems
    spec:
      containers:
        - name: warehouse-ems
          image: warehouse-ems:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: ems-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-ems-service
  labels:
    app: warehouse-ems
spec:
  type: ClusterIP
  selector:
    app: warehouse-ems
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
