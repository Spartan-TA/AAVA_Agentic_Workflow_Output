version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: warehouse_employee_management
      POSTGRES_USER: warehouse_admin
      POSTGRES_PASSWORD: warehouse_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/warehouse_employee_management
      SPRING_DATASOURCE_USERNAME: warehouse_admin
      SPRING_DATASOURCE_PASSWORD: warehouse_password
volumes:
  db_data: