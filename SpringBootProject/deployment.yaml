apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-employee-mgmt
  labels:
    app: warehouse-employee-mgmt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: warehouse-employee-mgmt
  template:
    metadata:
      labels:
        app: warehouse-employee-mgmt
    spec:
      containers:
        - name: warehouse-employee-mgmt
          image: warehouse-employee-mgmt:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-employee-mgmt
spec:
  type: ClusterIP
  selector:
    app: warehouse-employee-mgmt
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
