apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse-employee-mgmt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: warehouse-employee-mgmt
  template:
    metadata:
      labels:
        app: warehouse-employee-mgmt
    spec:
      containers:
        - name: app
          image: your-docker-repo/employee-mgmt:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db:5432/warehouse
            - name: SPRING_DATASOURCE_USERNAME
              value: warehouse_user
            - name: SPRING_DATASOURCE_PASSWORD
              value: warehouse_pass
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-employee-mgmt
spec:
  type: ClusterIP
  selector:
    app: warehouse-employee-mgmt
  ports:
    - port: 8080
      targetPort: 8080